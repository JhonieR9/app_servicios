<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Trabajadores - TalentHub</title>
    <link rel="icon" href="data:,">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; width:100%; overflow:hidden; font-family:'Inter',sans-serif; }
        #map { position:absolute; top:0; left:0; width:100%; height:100%; }

        /* ── TOP BAR ── */
        .top-bar {
            position:absolute; top:0; left:0; right:0; z-index:10;
            padding:12px 16px;
            display:flex; align-items:center; gap:10px;
            background:linear-gradient(180deg,rgba(255,255,255,0.95) 0%,rgba(255,255,255,0) 100%);
            pointer-events:none;
        }
        .top-bar > * { pointer-events:all; }
        .btn-back {
            width:42px; height:42px; border-radius:50%;
            background:white; border:none;
            box-shadow:0 2px 12px rgba(0,0,0,0.12);
            display:flex; align-items:center; justify-content:center;
            font-size:1.1rem; color:#1e293b; cursor:pointer;
            text-decoration:none; transition:all .2s;
        }
        .btn-back:hover { background:#f1f5f9; }
        .search-pill {
            flex:1; background:white; border-radius:99px;
            padding:12px 18px; box-shadow:0 2px 12px rgba(0,0,0,0.1);
            display:flex; align-items:center; gap:10px;
            font-size:0.88rem; color:#1e293b; font-weight:600;
        }
        .search-pill i { color:#6366f1; }
        .search-pill span { color:#64748b; font-weight:400; }

        /* ── STATUS BADGE ── */
        .status-float {
            position:absolute; top:70px; left:50%; transform:translateX(-50%);
            z-index:10; background:white; border-radius:99px;
            padding:8px 18px; box-shadow:0 4px 16px rgba(0,0,0,0.12);
            font-size:0.8rem; font-weight:700; color:#1e293b;
            display:flex; align-items:center; gap:6px;
            transition:all .3s;
        }

        /* ── BOTTOM SHEET ── */
        .bottom-sheet {
            position:absolute; bottom:0; left:0; right:0; z-index:20;
            background:white;
            border-radius:24px 24px 0 0;
            box-shadow:0 -4px 30px rgba(0,0,0,0.12);
            transform:translateY(100%);
            transition:transform .35s cubic-bezier(.4,0,.2,1);
            max-height:70vh; overflow-y:auto;
        }
        .bottom-sheet.open { transform:translateY(0); }
        .bottom-sheet-handle {
            width:36px; height:4px; background:#d1d5db;
            border-radius:99px; margin:10px auto 0;
        }
        .bs-content { padding:16px 20px 28px; }

        /* ── WORKER CARD (inside bottom sheet) ── */
        .bs-header {
            display:flex; align-items:center; gap:14px; margin-bottom:16px;
        }
        .bs-avatar {
            width:56px; height:56px; border-radius:50%;
            background:linear-gradient(135deg,#6366f1,#7c3aed);
            display:flex; align-items:center; justify-content:center;
            font-size:1.2rem; font-weight:800; color:white;
            flex-shrink:0; overflow:hidden;
            border:3px solid white; box-shadow:0 4px 12px rgba(99,102,241,0.2);
        }
        .bs-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
        .bs-name { font-size:1.05rem; font-weight:800; color:#0f172a; }
        .bs-category { font-size:0.78rem; color:#6366f1; font-weight:600; margin-top:2px; }
        .bs-badge {
            display:inline-flex; align-items:center; gap:4px;
            background:#ecfdf5; border:1px solid #a7f3d0;
            color:#059669; padding:3px 10px; border-radius:99px;
            font-size:0.68rem; font-weight:700; margin-top:6px;
        }

        /* ── STATS ROW ── */
        .bs-stats {
            display:grid; grid-template-columns:repeat(3,1fr);
            gap:8px; margin-bottom:16px;
        }
        .bs-stat {
            text-align:center; padding:12px 8px;
            background:#f8fafc; border-radius:12px;
            border:1px solid #f1f5f9;
        }
        .bs-stat-val { font-size:1rem; font-weight:800; color:#0f172a; }
        .bs-stat-val.stars { color:#f59e0b; }
        .bs-stat-label { font-size:0.65rem; color:#64748b; font-weight:600; margin-top:2px; text-transform:uppercase; }

        /* ── ACTIONS ── */
        .bs-actions { display:flex; gap:10px; }
        .bs-btn-primary {
            flex:1; padding:14px; border:none; border-radius:14px;
            background:linear-gradient(135deg,#4f46e5,#7c3aed);
            color:white; font-size:0.9rem; font-weight:700;
            cursor:pointer; display:flex; align-items:center;
            justify-content:center; gap:8px;
            box-shadow:0 4px 16px rgba(99,102,241,0.25);
            transition:all .2s; font-family:'Inter',sans-serif;
        }
        .bs-btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 24px rgba(99,102,241,0.35); }
        .bs-btn-secondary {
            padding:14px 18px; border:1px solid #e2e8f0; border-radius:14px;
            background:white; color:#475569; font-size:0.85rem;
            font-weight:700; cursor:pointer; transition:all .2s;
            font-family:'Inter',sans-serif; text-decoration:none;
            display:flex; align-items:center; justify-content:center; gap:6px;
        }
        .bs-btn-secondary:hover { background:#f8fafc; border-color:#6366f1; color:#4f46e5; }
        .bs-btn-fav {
            width:48px; height:48px; border-radius:14px;
            border:1px solid #e2e8f0; background:white;
            display:flex; align-items:center; justify-content:center;
            font-size:1.3rem; cursor:pointer; transition:all .2s;
        }
        .bs-btn-fav:hover { border-color:#ef4444; background:#fef2f2; }

        /* ── FILTER CHIPS ── */
        .filter-bar {
            position:absolute; bottom:0; left:0; right:0; z-index:15;
            padding:0 12px 16px;
            transition:transform .3s;
        }
        .filter-bar.hidden { transform:translateY(100%); }
        .filter-scroll {
            display:flex; gap:8px; overflow-x:auto;
            padding:8px 4px; scrollbar-width:none;
        }
        .filter-scroll::-webkit-scrollbar { display:none; }
        .filter-chip {
            padding:10px 16px; border-radius:99px;
            background:white; border:1.5px solid #e2e8f0;
            font-size:0.8rem; font-weight:600; color:#374151;
            white-space:nowrap; cursor:pointer;
            box-shadow:0 2px 8px rgba(0,0,0,0.06);
            transition:all .18s; flex-shrink:0;
            font-family:'Inter',sans-serif;
        }
        .filter-chip:hover { border-color:#6366f1; color:#4f46e5; }
        .filter-chip.active {
            background:linear-gradient(135deg,#4f46e5,#7c3aed);
            color:white; border-color:transparent;
            box-shadow:0 4px 12px rgba(99,102,241,0.3);
        }

        /* ── WORKER MARKER ── */
        .worker-marker {
            width:48px; height:48px; border-radius:50%;
            background:linear-gradient(135deg,#6366f1,#7c3aed);
            border:3px solid white;
            box-shadow:0 4px 16px rgba(99,102,241,0.35);
            display:flex; align-items:center; justify-content:center;
            font-size:0.8rem; font-weight:800; color:white;
            cursor:pointer; transition:all .2s; overflow:hidden;
        }
        .worker-marker:hover { transform:scale(1.15); }
        .worker-marker.selected {
            border-color:#4f46e5;
            box-shadow:0 0 0 4px rgba(99,102,241,0.25), 0 4px 16px rgba(99,102,241,0.4);
            transform:scale(1.1);
        }
        .worker-marker img { width:100%; height:100%; object-fit:cover; border-radius:50%; }

        /* ── USER MARKER ── */
        .user-marker {
            width:20px; height:20px;
            background:#4f46e5; border-radius:50%;
            border:3px solid white;
            box-shadow:0 0 0 4px rgba(79,70,229,0.2), 0 2px 8px rgba(79,70,229,0.4);
            animation:pulseUser 2s infinite;
        }
        @keyframes pulseUser {
            0%,100% { box-shadow:0 0 0 4px rgba(79,70,229,0.2), 0 2px 8px rgba(79,70,229,0.4); }
            50% { box-shadow:0 0 0 10px rgba(79,70,229,0), 0 2px 8px rgba(79,70,229,0.4); }
        }

        /* ── RADIUS CONTROL ── */
        .radius-control {
            position:absolute; top:70px; right:16px; z-index:10;
            background:white; border-radius:14px;
            padding:10px 14px; box-shadow:0 2px 12px rgba(0,0,0,0.1);
            display:flex; align-items:center; gap:8px;
        }
        .radius-control input {
            width:60px; padding:6px 8px; border:1px solid #e2e8f0;
            border-radius:8px; font-size:0.82rem; text-align:center;
            font-family:'Inter',sans-serif; outline:none;
        }
        .radius-control input:focus { border-color:#6366f1; }
        .radius-control label { font-size:0.72rem; color:#64748b; font-weight:600; }
        .radius-control button {
            padding:6px 12px; background:#6366f1; color:white;
            border:none; border-radius:8px; font-size:0.75rem;
            font-weight:700; cursor:pointer; font-family:'Inter',sans-serif;
        }
    </style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
    <a href="javascript:history.back()" class="btn-back"><i class="bi bi-arrow-left"></i></a>
    <div class="search-pill">
        <i class="bi bi-geo-alt-fill"></i>
        <span id="locationText">Buscando ubicación...</span>
    </div>
</div>

<!-- STATUS -->
<div class="status-float" id="statusBadge">
    <div style="width:8px;height:8px;border-radius:50%;background:#6366f1;animation:pulseUser 1.5s infinite"></div>
    Buscando...
</div>

<!-- RADIUS -->
<div class="radius-control">
    <label>📏</label>
    <input type="number" id="radio" value="10" min="1" max="50">
    <label>km</label>
    <button onclick="buscarTrabajadores()">🔍</button>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- FILTER CHIPS -->
<div class="filter-bar" id="filterBar">
    <div class="filter-scroll" id="filterScroll">
        <div class="filter-chip active" onclick="selCat(this,'')">🌐 Todas</div>
    </div>
</div>

<!-- BOTTOM SHEET -->
<div class="bottom-sheet" id="bottomSheet">
    <div class="bottom-sheet-handle"></div>
    <div class="bs-content" id="bsContent"></div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<script>
    mapboxgl.accessToken = '{{ mapbox_token | trim }}';

    let map, userMarker;
    let workerMarkers = [];
    let selectedMarkerEl = null;
    let userLat = 3.431608, userLng = -76.522041;
    let trabajadoresData = [];

    const urlParams = new URLSearchParams(window.location.search);
    let categoriaActiva = urlParams.get('categoria') || '';

    // ── Init Map ──
    map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/light-v11',
        center: [userLng, userLat],
        zoom: 13,
        attributionControl: false
    });
    map.addControl(new mapboxgl.NavigationControl({ showCompass:false }), 'bottom-right');

    // User marker
    const userEl = document.createElement('div');
    userEl.className = 'user-marker';
    userMarker = new mapboxgl.Marker({ element:userEl })
        .setLngLat([userLng, userLat])
        .addTo(map);

    // Close bottom sheet on map click
    map.on('click', () => cerrarBottomSheet());

    // ── Geolocation ──
    cargarCategorias();
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                userLat = pos.coords.latitude;
                userLng = pos.coords.longitude;
                map.flyTo({ center:[userLng,userLat], zoom:14 });
                userMarker.setLngLat([userLng, userLat]);
                document.getElementById('locationText').textContent = 'Tu ubicación actual';
                buscarTrabajadores();
            },
            () => {
                document.getElementById('locationText').textContent = 'Ubicación aproximada';
                buscarTrabajadores();
            },
            { enableHighAccuracy:true, timeout:8000 }
        );
    } else { buscarTrabajadores(); }

    // ── Categories ──
    async function cargarCategorias() {
        try {
            const res = await fetch('/cliente/categorias');
            const data = await res.json();
            const cats = (data.categorias||[]).sort((a,b) => a.nombre_categoria.localeCompare(b.nombre_categoria,'es'));
            const ICONOS = {'Plomería':'🔧','Electricidad':'⚡','Limpieza':'🧹','Carpintería':'🪚','Pintura':'🎨','Jardinería':'🌱','Cerrajería':'🔑','Mudanza':'📦','Construcción':'🏗️','Tecnología':'💻','Transporte':'🚚','Mecánica':'🔩','Belleza':'💇','Salud':'🩺','Educación':'📚','Gastronomía':'🍳','Eventos':'🎉','Fotografía':'📸','Mensajería':'📬'};
            const scroll = document.getElementById('filterScroll');
            cats.forEach(cat => {
                const chip = document.createElement('div');
                chip.className = 'filter-chip' + (cat.nombre_categoria === categoriaActiva ? ' active' : '');
                chip.textContent = (ICONOS[cat.nombre_categoria]||'🛠️') + ' ' + cat.nombre_categoria;
                chip.onclick = () => selCat(chip, cat.nombre_categoria);
                scroll.appendChild(chip);
            });
        } catch(e) {}
    }

    function selCat(el, cat) {
        categoriaActiva = cat;
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        buscarTrabajadores();
        cerrarBottomSheet();
    }

    // ── Search Workers ──
    function limpiarMarcadores() {
        workerMarkers.forEach(m => m.remove());
        workerMarkers = [];
        if (selectedMarkerEl) { selectedMarkerEl.classList.remove('selected'); selectedMarkerEl = null; }
    }

    async function buscarTrabajadores() {
        const radio = document.getElementById('radio').value;
        document.getElementById('statusBadge').innerHTML = '<div style="width:8px;height:8px;border-radius:50%;background:#6366f1;animation:pulseUser 1.5s infinite"></div> Buscando...';

        try {
            const url = `/cliente/trabajadores-cercanos?lat=${userLat}&lng=${userLng}&radio=${radio}${categoriaActiva ? '&categoria='+encodeURIComponent(categoriaActiva) : ''}`;
            const res = await fetch(url);
            const data = await res.json();
            trabajadoresData = data.trabajadores || [];

            if (trabajadoresData.length > 0) {
                agregarMarcadores(trabajadoresData);
                const label = categoriaActiva ? ` de ${categoriaActiva}` : '';
                document.getElementById('statusBadge').innerHTML = `<div style="width:8px;height:8px;border-radius:50%;background:#10b981"></div> ${trabajadoresData.length} profesional${trabajadoresData.length>1?'es':''}${label}`;
            } else {
                limpiarMarcadores();
                document.getElementById('statusBadge').innerHTML = `<div style="width:8px;height:8px;border-radius:50%;background:#ef4444"></div> Sin resultados`;
            }
        } catch(e) {
            document.getElementById('statusBadge').innerHTML = `<div style="width:8px;height:8px;border-radius:50%;background:#ef4444"></div> Error`;
        }
    }

    function agregarMarcadores(trabajadores) {
        limpiarMarcadores();
        trabajadores.forEach((t, i) => {
            const el = document.createElement('div');
            el.className = 'worker-marker';
            const img = document.createElement('img');
            img.src = '/trabajador/archivo/' + t.id + '/perfil';
            img.onerror = function() {
                this.remove();
                el.textContent = (t.nombre||'P').split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase();
            };
            el.appendChild(img);

            el.addEventListener('click', (e) => {
                e.stopPropagation();
                seleccionarTrabajador(t, el);
            });

            const marker = new mapboxgl.Marker({ element:el })
                .setLngLat([t.longitud, t.latitud])
                .addTo(map);
            workerMarkers.push(marker);
        });

        // Fit bounds
        if (trabajadores.length > 0) {
            const bounds = new mapboxgl.LngLatBounds();
            trabajadores.forEach(t => bounds.extend([t.longitud, t.latitud]));
            bounds.extend([userLng, userLat]);
            map.fitBounds(bounds, { padding:80 });
        }
    }

    // ── Select Worker → Bottom Sheet ──
    function seleccionarTrabajador(t, el) {
        // Deselect previous
        if (selectedMarkerEl) selectedMarkerEl.classList.remove('selected');
        el.classList.add('selected');
        selectedMarkerEl = el;

        // Fly to worker
        map.flyTo({ center:[t.longitud, t.latitud], zoom:15, duration:800 });

        // Hide filters
        document.getElementById('filterBar').classList.add('hidden');

        // Build bottom sheet
        const calNum = parseFloat(t.calificacion) || 0;
        const estrellas = calNum > 0 ? '★'.repeat(Math.round(calNum)) + ' ' + calNum.toFixed(1) : '—';
        const iniciales = (t.nombre||'P').split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase();

        document.getElementById('bsContent').innerHTML = `
            <div class="bs-header">
                <div class="bs-avatar">
                    <img src="/trabajador/archivo/${t.id}/perfil" onerror="this.remove();this.parentElement.textContent='${iniciales}'">
                </div>
                <div style="flex:1;min-width:0">
                    <div class="bs-name">${t.nombre}</div>
                    <div class="bs-category">🔧 ${t.categoria || 'Profesional'}</div>
                    <div class="bs-badge"><i class="bi bi-patch-check-fill"></i> Verificado · ${t.distancia} km</div>
                </div>
                <button class="bs-btn-fav" id="bsFav" onclick="toggleFav(${t.id}, this)" title="Favorito">🤍</button>
            </div>
            <div class="bs-stats">
                <div class="bs-stat">
                    <div class="bs-stat-val stars">${estrellas}</div>
                    <div class="bs-stat-label">Calificación</div>
                </div>
                <div class="bs-stat">
                    <div class="bs-stat-val">${t.experiencia || 0}+</div>
                    <div class="bs-stat-label">Años exp.</div>
                </div>
                <div class="bs-stat">
                    <div class="bs-stat-val">${t.tarifa ? '$'+parseInt(t.tarifa).toLocaleString('es-CO') : '—'}</div>
                    <div class="bs-stat-label">Por hora</div>
                </div>
            </div>
            <div class="bs-actions">
                <button class="bs-btn-primary" onclick="solicitarServicio(${t.id},'${(t.nombre||'').replace(/'/g,"\\'")}','${(t.categoria||'').replace(/'/g,"\\'")}')">
                    <i class="bi bi-send-fill"></i> Solicitar
                </button>
                <a href="/trabajador/perfil/${t.id}" class="bs-btn-secondary">
                    <i class="bi bi-person"></i> Perfil
                </a>
            </div>
        `;

        // Open sheet
        document.getElementById('bottomSheet').classList.add('open');
    }

    function cerrarBottomSheet() {
        document.getElementById('bottomSheet').classList.remove('open');
        document.getElementById('filterBar').classList.remove('hidden');
        if (selectedMarkerEl) { selectedMarkerEl.classList.remove('selected'); selectedMarkerEl = null; }
    }

    // ── Solicitar ──
    function solicitarServicio(id, nombre, categoria) {
        const idCliente = parseInt(localStorage.getItem('id_cliente') || 0);
        if (!idCliente) {
            window.location.href = `/cliente/solicitar_servicio?trabajador_id=${id}&trabajador_nombre=${encodeURIComponent(nombre)}&categoria=${encodeURIComponent(categoria)}`;
            return;
        }
        abrirModalChat(id, nombre, categoria, idCliente);
    }

    // ── Favorito ──
    async function toggleFav(idTrabajador, btn) {
        const idCliente = parseInt(localStorage.getItem('id_cliente') || 0);
        if (!idCliente) { alert('Inicia sesión para guardar favoritos'); return; }
        btn.style.transform = 'scale(1.3)';
        setTimeout(() => btn.style.transform = '', 200);
        const fd = new FormData();
        fd.append('id_trabajador', idTrabajador);
        fd.append('id_cliente', idCliente);
        try {
            const res = await fetch('/cliente/favorito/toggle', { method:'POST', body:fd });
            const data = await res.json();
            if (data.ok) btn.textContent = data.favorito ? '❤️' : '🤍';
        } catch(e) {}
    }

    // ── Chat Modal ──
    function abrirModalChat(idTrabajador, nombre, categoria, idCliente) {
        let modal = document.getElementById('chatModal');
        if (!modal) {
            modal = document.createElement('div');
            modal.id = 'chatModal';
            modal.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;';
            modal.innerHTML = `
                <div style="background:white;border-radius:24px 24px 0 0;width:100%;max-width:500px;padding:24px 20px 32px;box-shadow:0 -8px 40px rgba(0,0,0,0.15)">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
                        <div>
                            <div style="font-size:1rem;font-weight:800;color:#0f172a" id="modalNombre"></div>
                            <div style="font-size:0.78rem;color:#6366f1;margin-top:2px" id="modalCategoria"></div>
                        </div>
                        <button onclick="cerrarModalChat()" style="background:#f1f5f9;border:1px solid #e2e8f0;color:#64748b;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center">✕</button>
                    </div>
                    <div style="margin-bottom:12px">
                        <label style="font-size:0.72rem;font-weight:700;color:#6366f1;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:6px">📍 Dirección del servicio *</label>
                        <input id="modalDireccion" type="text" placeholder="Ej: Cra 10 #25-30, Barrio Centro"
                            style="width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;font-size:0.88rem;color:#1e293b;outline:none;font-family:'Inter',sans-serif"
                            onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#e2e8f0'">
                    </div>
                    <div style="margin-bottom:16px">
                        <label style="font-size:0.72rem;font-weight:700;color:#64748b;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:6px">Mensaje inicial (opcional)</label>
                        <textarea id="modalMensaje" rows="2" placeholder="Ej: Hola, necesito ayuda con..."
                            style="width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;font-size:0.88rem;color:#1e293b;outline:none;resize:none;font-family:'Inter',sans-serif"
                            onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#e2e8f0'"></textarea>
                    </div>
                    <button id="modalBtn" onclick="confirmarChat()"
                        style="width:100%;padding:15px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;border:none;border-radius:14px;font-size:0.95rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 16px rgba(99,102,241,0.25)">
                        <i class="bi bi-chat-fill"></i> Iniciar conversación
                    </button>
                </div>`;
            document.body.appendChild(modal);
            modal.addEventListener('click', e => { if (e.target === modal) cerrarModalChat(); });
        }
        modal._idTrabajador = idTrabajador;
        modal._idCliente = idCliente;
        modal._categoria = categoria;
        document.getElementById('modalNombre').textContent = '💬 Chatear con ' + nombre;
        document.getElementById('modalCategoria').textContent = '🔧 ' + categoria;
        document.getElementById('modalMensaje').value = '';
        document.getElementById('modalDireccion').value = '';
        modal.style.display = 'flex';
    }

    function cerrarModalChat() {
        const modal = document.getElementById('chatModal');
        if (modal) modal.style.display = 'none';
    }

    async function confirmarChat() {
        const modal = document.getElementById('chatModal');
        const btn = document.getElementById('modalBtn');
        const mensaje = document.getElementById('modalMensaje').value.trim();
        const direccion = document.getElementById('modalDireccion').value.trim();

        if (!direccion) {
            document.getElementById('modalDireccion').style.borderColor = '#ef4444';
            document.getElementById('modalDireccion').focus();
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Iniciando...';

        const fd = new FormData();
        fd.append('id_cliente', modal._idCliente);
        fd.append('id_trabajador', modal._idTrabajador);
        fd.append('categoria', modal._categoria);
        fd.append('direccion', direccion);
        if (mensaje) fd.append('mensaje_inicial', mensaje);

        try {
            const res = await fetch('/cliente/iniciar-chat', { method:'POST', body:fd });
            const data = await res.json();
            if (res.ok && data.redirect) {
                window.location.href = data.redirect;
            } else {
                alert('Error: ' + (data.error || 'No se pudo iniciar'));
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-chat-fill"></i> Iniciar conversación';
            }
        } catch(e) {
            alert('Error de conexión');
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-chat-fill"></i> Iniciar conversación';
        }
    }
</script>
</body>
</html>
