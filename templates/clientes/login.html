<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - TalentHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/auth-claro.css">
</head>
<body>
<div class="bg"></div>

<div class="card">
    <div class="logo-wrap">
        <div class="logo-icon"><i class="bi bi-search"></i></div>
        <div class="logo-title">Bienvenido</div>
        <div class="logo-sub">Ingresa para solicitar servicios</div>
    </div>

    <div id="alert" class="alert"></div>

    <!-- Banner sesión expirada -->
    <div id="alertExpired" class="alert-expired" role="alert"><i class="bi bi-clock-history"></i> Tu sesión expiró. Vuelve a ingresar.</div>

    <form id="formLogin">
        <div class="form-group">
            <label class="form-label">CORREO ELECTRÓNICO</label>
            <div class="input-wrap">
                <i class="bi bi-envelope input-icon"></i>
                <input type="email" name="correo" placeholder="tu@correo.com" required>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">CONTRASEÑA</label>
            <div class="input-wrap">
                <i class="bi bi-lock input-icon"></i>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
                <button type="button" class="toggle-pw" onclick="togglePw()" aria-label="Mostrar u ocultar contraseña">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn" id="btnLogin">
            <i class="bi bi-box-arrow-in-right"></i> Ingresar
        </button>
    </form>

    <a href="/cliente/recuperar" class="link-olvido">¿Olvidaste tu contraseña?</a>

    <div class="divider">o</div>

    <a href="/cliente/registro" class="btn-register">
        <i class="bi bi-person-plus"></i> Crear cuenta nueva
    </a>

    <a href="/" class="back">← Volver al inicio</a>
</div>

<script src="/static/js/mfa-login.js"></script>
<script>
    function togglePw() {
        const input = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        const isText = input.type === 'text';
        input.type = isText ? 'password' : 'text';
        icon.className = isText ? 'bi bi-eye' : 'bi bi-eye-slash';
    }

    const alertEl = document.getElementById('alert');

    // Mostrar banner si viene de sesión expirada
    if (new URLSearchParams(window.location.search).get('expired') === '1') {
        document.getElementById('alertExpired').style.display = 'flex';
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnLogin');
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Verificando...';

        const fd = new FormData(e.target);
        try {
            const res = await fetch('/cliente/login', { method: 'POST', body: fd });
            let data = await res.json();
            let ok = res.ok;
            if (data.mfa_requerido) { const r = await MFA.resolver(data); ok = r.ok; data = r.data; }
            if (ok) {
                alertEl.className = 'alert success';
                alertEl.textContent = '✅ ' + data.mensaje;
                alertEl.style.display = 'block';
                // Guardar datos en localStorage para pre-llenar formularios
                if (data.nombre)     localStorage.setItem('cliente_nombre',   data.nombre);
                if (data.telefono)   localStorage.setItem('cliente_telefono', data.telefono);
                if (data.correo)     localStorage.setItem('cliente_correo',   data.correo);
                if (data.id_cliente) localStorage.setItem('id_cliente',       data.id_cliente);
                setTimeout(() => window.location.href = data.redirect || '/cliente/panel', 1000);
            } else {
                alertEl.className = 'alert error';
                alertEl.textContent = '❌ ' + (data.error || 'Error al iniciar sesión');
                alertEl.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Ingresar';
            }
        } catch(err) {
            alertEl.className = 'alert error';
            alertEl.textContent = '❌ Error de conexión';
            alertEl.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Ingresar';
        }
    });
</script>
</body>
</html>
