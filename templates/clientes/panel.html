<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>TalentHub</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html,body { height:100%; background:#f8f9fb; font-family:'Inter',sans-serif; overflow-x:hidden; }

        /* ── HEADER ── */
        .header {
            background:white;
            padding:16px 20px 12px;
            display:flex; align-items:center; justify-content:space-between;
            position:sticky; top:0; z-index:50;
            border-bottom:1px solid #f1f3f5;
        }
        .header-left { display:flex; align-items:center; gap:12px; }
        .avatar {
            width:44px; height:44px; border-radius:50%;
            background:linear-gradient(135deg,#4f46e5,#7c3aed);
            display:flex; align-items:center; justify-content:center;
            font-size:1rem; font-weight:800; color:white; flex-shrink:0;
        }
        .greeting-sub { font-size:0.72rem; color:#9ca3af; font-weight:500; }
        .greeting-name { font-size:1rem; font-weight:800; color:#111827; line-height:1.2; }
        .header-right { display:flex; align-items:center; gap:10px; }
        .btn-notif {
            width:40px; height:40px; border-radius:50%; background:#f3f4f6;
            border:none; display:flex; align-items:center; justify-content:center;
            font-size:1.1rem; cursor:pointer; position:relative; text-decoration:none; color:#374151;
        }
        .btn-salir {
            width:40px; height:40px; border-radius:50%; background:#fee2e2;
            border:none; display:flex; align-items:center; justify-content:center;
            font-size:1rem; cursor:pointer; color:#ef4444; text-decoration:none;
        }

        /* ── CONTENIDO ── */
        .content { padding:20px 16px 100px; max-width:600px; margin:0 auto; }

        /* ── BARRA DE ACCIÓN PRINCIPAL ── */
        .action-bar {
            background:linear-gradient(135deg,#4f46e5,#7c3aed);
            border-radius:20px;
            padding:22px 20px;
            margin-bottom:24px;
            cursor:pointer;
            position:relative;
            overflow:hidden;
            box-shadow:0 8px 32px rgba(79,70,229,0.35);
            transition:transform .15s, box-shadow .15s;
        }
        .action-bar:active { transform:scale(0.98); }
        .action-bar::before {
            content:'';
            position:absolute; top:-40px; right:-40px;
            width:120px; height:120px; border-radius:50%;
            background:rgba(255,255,255,0.08);
        }
        .action-bar::after {
            content:'';
            position:absolute; bottom:-30px; left:20px;
            width:80px; height:80px; border-radius:50%;
            background:rgba(255,255,255,0.05);
        }
        .action-label {
            font-size:0.72rem; font-weight:700; color:rgba(255,255,255,0.75);
            text-transform:uppercase; letter-spacing:1.5px; margin-bottom:6px;
        }
        .action-question {
            font-size:1.35rem; font-weight:900; color:white; line-height:1.2;
            margin-bottom:16px; position:relative; z-index:1;
        }
        .action-cats {
            display:flex; gap:8px; flex-wrap:wrap; position:relative; z-index:1;
        }
        .action-cat {
            background:rgba(255,255,255,0.2);
            color:white; font-size:0.75rem; font-weight:700;
            padding:6px 12px; border-radius:99px;
            cursor:pointer; border:none; font-family:'Inter',sans-serif;
            transition:background .15s;
        }
        .action-cat:hover { background:rgba(255,255,255,0.35); }
        .action-btn {
            position:absolute; right:20px; top:50%; transform:translateY(-50%);
            width:48px; height:48px; border-radius:50%;
            background:white; border:none; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            box-shadow:0 4px 16px rgba(0,0,0,0.15);
            font-size:1.2rem; color:#4f46e5;
        }

        /* ── TARJETA DE SERVICIO ACTIVO ── */
        .servicio-activo {
            background:white; border-radius:20px;
            border:2px solid #e0e7ff;
            padding:18px 18px; margin-bottom:24px;
            position:relative; overflow:hidden;
        }
        .servicio-activo::before {
            content:''; position:absolute; top:0; left:0; right:0; height:3px;
            background:linear-gradient(90deg,#4f46e5,#7c3aed,#06b6d4);
        }
        .sa-header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
        .sa-dot {
            width:10px; height:10px; border-radius:50%; flex-shrink:0;
            animation:pulse 1.5s infinite;
        }
        .sa-dot.pendiente  { background:#f59e0b; box-shadow:0 0 8px rgba(245,158,11,.5); }
        .sa-dot.aceptada   { background:#3b82f6; box-shadow:0 0 8px rgba(59,130,246,.5); }
        .sa-dot.en_proceso { background:#10b981; box-shadow:0 0 8px rgba(16,185,129,.5); }
        .sa-dot.cotizacion_enviada { background:#8b5cf6; box-shadow:0 0 8px rgba(139,92,246,.5); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .sa-label { font-size:0.7rem; font-weight:700; color:#6366f1; text-transform:uppercase; letter-spacing:1px; }
        .sa-titulo { font-size:1rem; font-weight:800; color:#111827; margin-bottom:4px; }
        .sa-meta   { font-size:0.78rem; color:#6b7280; }
        .sa-badge  {
            display:inline-flex; align-items:center; gap:5px;
            font-size:0.72rem; font-weight:700; padding:4px 10px; border-radius:99px;
        }
        .badge-pendiente         { background:#fef3c7; color:#92400e; }
        .badge-aceptada          { background:#dbeafe; color:#1e40af; }
        .badge-en_proceso        { background:#d1fae5; color:#065f46; }
        .badge-cotizacion_enviada{ background:#ede9fe; color:#5b21b6; }
        .sa-actions { display:flex; gap:8px; margin-top:14px; }
        .sa-btn {
            flex:1; padding:11px; border-radius:12px; border:none;
            font-size:0.82rem; font-weight:700; cursor:pointer;
            font-family:'Inter',sans-serif; text-decoration:none;
            display:flex; align-items:center; justify-content:center; gap:6px;
            transition:transform .15s;
        }
        .sa-btn:active { transform:scale(0.97); }
        .sa-btn-primary { background:linear-gradient(135deg,#4f46e5,#7c3aed); color:white; }
        .sa-btn-secondary { background:#f3f4f6; color:#374151; }

        /* Múltiples activas */
        .multi-activas { display:flex; flex-direction:column; gap:10px; margin-bottom:24px; }
        .mini-activa {
            background:white; border-radius:14px; border:1px solid #e5e7eb;
            padding:14px 16px; display:flex; align-items:center; gap:12px;
            cursor:pointer; transition:border-color .2s;
        }
        .mini-activa:hover { border-color:#6366f1; }
        .mini-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
        .mini-info { flex:1; min-width:0; }
        .mini-titulo { font-size:0.85rem; font-weight:700; color:#111827; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .mini-meta   { font-size:0.72rem; color:#9ca3af; margin-top:1px; }
        .mini-badge  { font-size:0.68rem; font-weight:700; padding:3px 8px; border-radius:99px; white-space:nowrap; }

        /* ── VACÍO ── */
        .empty-state {
            text-align:center; padding:28px 20px; margin-bottom:24px;
            background:white; border-radius:20px; border:2px dashed #e5e7eb;
        }
        .empty-emoji { font-size:2.5rem; margin-bottom:10px; }
        .empty-title { font-size:1rem; font-weight:800; color:#111827; margin-bottom:6px; }
        .empty-sub   { font-size:0.82rem; color:#9ca3af; margin-bottom:16px; }
        .empty-btn {
            display:inline-flex; align-items:center; gap:8px;
            background:linear-gradient(135deg,#4f46e5,#7c3aed);
            color:white; padding:12px 24px; border-radius:14px;
            font-size:0.88rem; font-weight:700; text-decoration:none;
            transition:transform .15s;
        }
        .empty-btn:active { transform:scale(0.97); }

        /* ── SECTION TITLE ── */
        .sec-title {
            font-size:0.78rem; font-weight:700; color:#9ca3af;
            text-transform:uppercase; letter-spacing:1.5px;
            margin-bottom:12px; display:flex; align-items:center; gap:6px;
        }

        /* ── FAVORITOS ── */
        .favs-scroll { display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none; margin-bottom:24px; }
        .favs-scroll::-webkit-scrollbar { display:none; }
        .fav-card {
            background:white; border-radius:16px; border:1px solid #e5e7eb;
            padding:16px; min-width:180px; flex-shrink:0;
            display:flex; flex-direction:column; gap:4px;
            transition:transform .15s, border-color .2s;
        }
        .fav-card:hover { transform:translateY(-2px); border-color:#c7d2fe; }
        .fav-nombre { font-size:0.88rem; font-weight:800; color:#111827; }
        .fav-cat    { font-size:0.72rem; color:#6366f1; font-weight:600; }
        .fav-city   { font-size:0.7rem; color:#9ca3af; }
        .fav-stars  { font-size:0.75rem; color:#f59e0b; }
        .fav-btn {
            margin-top:10px; padding:9px; border:none; border-radius:10px;
            background:linear-gradient(135deg,#4f46e5,#7c3aed);
            color:white; font-size:0.78rem; font-weight:700;
            cursor:pointer; font-family:'Inter',sans-serif;
            text-decoration:none; text-align:center; display:block;
        }

        /* ── BOTTOM NAV ── */
        .bottom-nav {
            position:fixed; bottom:0; left:0; right:0;
            background:white; border-top:1px solid #f1f3f5;
            display:flex; padding:8px 0 max(8px, env(safe-area-inset-bottom));
            z-index:50; box-shadow:0 -4px 20px rgba(0,0,0,0.06);
        }
        .nav-item {
            flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
            padding:6px 4px; cursor:pointer; text-decoration:none;
            border:none; background:none; font-family:'Inter',sans-serif;
            transition:color .15s;
        }
        .nav-item i { font-size:1.25rem; color:#9ca3af; transition:color .15s; }
        .nav-item span { font-size:0.62rem; font-weight:600; color:#9ca3af; transition:color .15s; }
        .nav-item.active i, .nav-item.active span { color:#4f46e5; }
        .nav-item:hover i, .nav-item:hover span { color:#4f46e5; }

        /* ── TOAST ── */
        .toast {
            position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
            background:#111827; color:white; padding:10px 20px; border-radius:99px;
            font-size:0.82rem; font-weight:600; z-index:200;
            animation:fadeInUp .3s ease;
        }
        @keyframes fadeInUp { from{opacity:0;transform:translate(-50%,10px)} to{opacity:1;transform:translate(-50%,0)} }
    </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    <div class="header-left">
        <div class="avatar" id="avatarInicial">👤</div>
        <div>
            <div class="greeting-sub" id="greetingSub">Buenos días</div>
            <div class="greeting-name" id="greeting">Cargando...</div>
        </div>
    </div>
    <div class="header-right">
        <a href="/cliente/mis_solicitudes" class="btn-notif" id="link-solicitudes-cliente" title="Mis solicitudes">
            <i class="bi bi-list-check"></i>
            <span id="badgeActivas" style="display:none;position:absolute;top:4px;right:4px;width:8px;height:8px;background:#ef4444;border-radius:50%;border:2px solid white"></span>
        </a>
        <a href="/cliente/logout" class="btn-salir" title="Salir">
            <i class="bi bi-box-arrow-left"></i>
        </a>
    </div>
</div>

<div class="content">

    <!-- BARRA DE ACCIÓN PRINCIPAL -->
    <div class="action-bar" id="actionBar" onclick="irASolicitar()">
        <div class="action-label">TalentHub</div>
        <div class="action-question">¿Qué servicio<br>necesitas hoy?</div>
        <div class="action-cats" id="actionCats">
            <button class="action-cat" onclick="irACat(event,'Plomería')">🔧 Plomería</button>
            <button class="action-cat" onclick="irACat(event,'Electricidad')">⚡ Electricidad</button>
            <button class="action-cat" onclick="irACat(event,'Limpieza')">🧹 Limpieza</button>
            <button class="action-cat" onclick="irACat(event,'Carpintería')">🪚 Carpintería</button>
            <button class="action-cat" onclick="irACat(event,'Pintura')">🎨 Pintura</button>
        </div>
    </div>

    <!-- ESTADO DE SERVICIOS ACTIVOS -->
    <div id="activosSection"></div>

    <!-- FAVORITOS -->
    <div id="favoritosSection" style="display:none">
        <div class="sec-title"><i class="bi bi-heart-fill" style="color:#ef4444"></i> Mis profesionales</div>
        <div class="favs-scroll" id="favsScroll"></div>
    </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
    <a href="/cliente/panel" class="nav-item active">
        <i class="bi bi-house-fill"></i>
        <span>Inicio</span>
    </a>
    <a href="/cliente/solicitar_servicio" class="nav-item" id="link-solicitar">
        <i class="bi bi-plus-circle-fill"></i>
        <span>Pedir</span>
    </a>
    <a href="/cliente/mapa" class="nav-item" id="link-mapa">
        <i class="bi bi-map-fill"></i>
        <span>Mapa</span>
    </a>
    <a href="/cliente/mis_solicitudes" class="nav-item" id="link-historial">
        <i class="bi bi-clock-history"></i>
        <span>Historial</span>
    </a>
</div>

<script>
let idCliente = null;

// Saludo según hora
const hora = new Date().getHours();
const saludo = hora < 12 ? 'Buenos días' : hora < 18 ? 'Buenas tardes' : 'Buenas noches';
document.getElementById('greetingSub').textContent = saludo;

function setNombre(nombre) {
    const primerNombre = nombre.split(' ')[0];
    document.getElementById('greeting').textContent = 'Hola, ' + primerNombre + ' 👋';
    const iniciales = nombre.split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase();
    const av = document.getElementById('avatarInicial');
    av.textContent = iniciales || '👤';
    av.style.fontSize = '0.95rem';
}

function irASolicitar() {
    window.location.href = '/cliente/solicitar_servicio' + (idCliente ? '?id_cliente='+idCliente : '');
}

function irACat(e, cat) {
    e.stopPropagation();
    window.location.href = '/cliente/solicitar_servicio?categoria=' + encodeURIComponent(cat) + (idCliente ? '&id_cliente='+idCliente : '');
}

// Cargar perfil
async function cargarPerfil() {
    const params = new URLSearchParams(window.location.search);
    const nombre = params.get('nombre');
    const id     = params.get('id');

    if (nombre) setNombre(decodeURIComponent(nombre));
    else if (localStorage.getItem('nombre_cliente')) setNombre(localStorage.getItem('nombre_cliente'));

    if (id) { idCliente = parseInt(id); localStorage.setItem('id_cliente', idCliente); }

    try {
        const res = await fetch('/cliente/mi-perfil', { credentials:'include' });
        if (res.ok) {
            const data = await res.json();
            if (!data.error && data.id_cliente) {
                idCliente = data.id_cliente;
                localStorage.setItem('id_cliente', idCliente);
                if (data.nombre_completo) {
                    setNombre(data.nombre_completo);
                    localStorage.setItem('nombre_cliente', data.nombre_completo);
                }
            }
        }
    } catch(e) {}

    if (!idCliente) idCliente = parseInt(localStorage.getItem('id_cliente')) || null;

    if (idCliente) {
        document.getElementById('link-solicitudes-cliente').href = '/cliente/mis_solicitudes?id_cliente=' + idCliente;
        document.getElementById('link-solicitar').href           = '/cliente/solicitar_servicio?id_cliente=' + idCliente;
        document.getElementById('link-mapa').href                = '/cliente/mapa?id_cliente=' + idCliente;
        document.getElementById('link-historial').href           = '/cliente/mis_solicitudes?id_cliente=' + idCliente;
        cargarActivos();
        cargarFavoritos();
    }
}

// Cargar servicios activos
async function cargarActivos() {
    try {
        const res  = await fetch('/cliente/mis_solicitudes_api?id_cliente=' + idCliente);
        const data = await res.json();
        const todas = data.solicitudes || [];

        const activas = todas.filter(s =>
            ['pendiente','aceptada','en_proceso','cotizacion_enviada'].includes(s.estado)
        );

        const sec = document.getElementById('activosSection');

        if (activas.length === 0) {
            sec.innerHTML = `
            <div class="empty-state">
                <div class="empty-emoji">🔍</div>
                <div class="empty-title">Sin servicios activos</div>
                <div class="empty-sub">Cuando pidas un servicio aparecerá aquí con el estado en tiempo real</div>
                <a href="/cliente/solicitar_servicio${idCliente?'?id_cliente='+idCliente:''}" class="empty-btn">
                    <i class="bi bi-plus-circle-fill"></i> Pedir mi primer servicio
                </a>
            </div>`;
            return;
        }

        // Badge en el botón de notificaciones
        document.getElementById('badgeActivas').style.display = 'block';

        if (activas.length === 1) {
            const s = activas[0];
            renderActivoPrincipal(sec, s);
        } else {
            // Múltiples activos
            let html = `<div class="sec-title"><i class="bi bi-activity" style="color:#4f46e5"></i> ${activas.length} servicios en curso</div><div class="multi-activas">`;
            activas.forEach(s => {
                const colorDot = {pendiente:'#f59e0b',aceptada:'#3b82f6',en_proceso:'#10b981',cotizacion_enviada:'#8b5cf6'}[s.estado] || '#9ca3af';
                const labelEstado = {pendiente:'Buscando profesional',aceptada:'Asignado',en_proceso:'En proceso',cotizacion_enviada:'Cotización recibida'}[s.estado] || s.estado;
                html += `<div class="mini-activa" onclick="window.location='/cliente/seguimiento?id=${s.id_solicitud}'">
                    <div class="mini-dot" style="background:${colorDot};box-shadow:0 0 6px ${colorDot}88"></div>
                    <div class="mini-info">
                        <div class="mini-titulo">${s.titulo||s.nombre_categoria||'Servicio'}</div>
                        <div class="mini-meta">${labelEstado}${s.nombre_trabajador?' · '+s.nombre_trabajador:''}</div>
                    </div>
                    <i class="bi bi-chevron-right" style="color:#d1d5db;font-size:0.85rem"></i>
                </div>`;
            });
            html += '</div>';
            sec.innerHTML = html;
        }
    } catch(e) {
        document.getElementById('activosSection').innerHTML = '';
    }
}

function renderActivoPrincipal(sec, s) {
    const labelEstado = {
        pendiente:'Buscando profesional...',
        aceptada:'Profesional asignado ✓',
        en_proceso:'En proceso ahora mismo 🔧',
        cotizacion_enviada:'Cotización recibida 💰'
    }[s.estado] || s.estado;

    const emojiEstado = {
        pendiente:'⏳', aceptada:'✅', en_proceso:'🔧', cotizacion_enviada:'💰'
    }[s.estado] || '📋';

    sec.innerHTML = `
    <div class="sec-title"><i class="bi bi-activity" style="color:#4f46e5"></i> Servicio activo</div>
    <div class="servicio-activo">
        <div class="sa-header">
            <div class="sa-dot ${s.estado}"></div>
            <div class="sa-label">${labelEstado}</div>
        </div>
        <div class="sa-titulo">${emojiEstado} ${s.titulo || s.nombre_categoria || 'Servicio'}</div>
        <div class="sa-meta">
            ${s.nombre_trabajador ? '👷 ' + s.nombre_trabajador : '🔍 Sin profesional asignado aún'}
            ${s.ciudad ? ' · 📍 ' + s.ciudad : ''}
        </div>
        ${s.cotizacion_precio ? `
        <div style="margin-top:10px;background:#f5f3ff;border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between">
            <span style="font-size:0.8rem;color:#6366f1;font-weight:700">💰 Cotización</span>
            <span style="font-size:1.1rem;font-weight:900;color:#4f46e5">$${Number(s.cotizacion_precio).toLocaleString('es-CO')}</span>
        </div>` : ''}
        <div class="sa-actions">
            <a href="/chat/?id_solicitud=${s.id_solicitud}&tipo=cliente&id_usuario=${idCliente}"
               class="sa-btn sa-btn-primary">
                <i class="bi bi-chat-dots-fill"></i> Chat
            </a>
            <a href="/cliente/seguimiento?id=${s.id_solicitud}"
               class="sa-btn sa-btn-secondary">
                <i class="bi bi-geo-alt-fill"></i> Seguimiento
            </a>
        </div>
    </div>`;
}

// Cargar favoritos
async function cargarFavoritos() {
    try {
        const res  = await fetch('/cliente/favoritos?id_cliente=' + idCliente);
        const data = await res.json();
        const favs = data.favoritos || [];
        if (!favs.length) return;

        document.getElementById('favoritosSection').style.display = 'block';
        const scroll = document.getElementById('favsScroll');
        scroll.innerHTML = favs.map(f => {
            const estrellas = f.calificacion > 0
                ? '★'.repeat(Math.round(f.calificacion)) + '☆'.repeat(5-Math.round(f.calificacion))
                : '';
            return `<div class="fav-card">
                <div class="fav-nombre">${f.nombre_completo}</div>
                <div class="fav-cat">🔧 ${f.servicio_tipo||'Profesional'}</div>
                <div class="fav-city">📍 ${f.ciudad||''}</div>
                ${estrellas ? `<div class="fav-stars">${estrellas} ${f.calificacion}</div>` : ''}
                <a href="/cliente/solicitar_servicio?trabajador_id=${f.id_persona}&id_cliente=${idCliente}"
                   class="fav-btn">Solicitar</a>
            </div>`;
        }).join('');
    } catch(e) {}
}

function mostrarToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}

// Refrescar activos cada 20s
setInterval(() => { if (idCliente) cargarActivos(); }, 20000);

cargarPerfil();
