<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PQRS - TalentHub Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body { background:#f8fafc; font-family:'Segoe UI',sans-serif; }
        .main { max-width:900px; margin:0 auto; padding:24px 16px; }
        h2 { font-size:1.4rem; font-weight:800; color:#0f172a; }
        .tabs { display:flex; gap:8px; margin:14px 0; flex-wrap:wrap; }
        .tab { padding:9px 16px; border-radius:10px; border:none; font-weight:700; font-size:.85rem; cursor:pointer; background:#e2e8f0; color:#64748b; }
        .tab.active { background:#4f46e5; color:#fff; }
        .card-p { background:#fff; border-radius:16px; padding:18px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); border-left:4px solid #f59e0b; }
        .card-p.en_tramite { border-left-color:#3b82f6; }
        .card-p.resuelto { border-left-color:#10b981; }
        .rad { font-weight:800; color:#4338ca; }
        .meta { font-size:.8rem; color:#64748b; }
        .msg { white-space:pre-wrap; background:#f8fafc; border-radius:10px; padding:10px 12px; margin:10px 0; font-size:.9rem; }
        .vencida { color:#b91c1c; font-weight:700; }
        textarea { width:100%; min-height:90px; border:1.5px solid #e2e8f0; border-radius:10px; padding:10px; font-size:.9rem; }
        .empty { text-align:center; padding:40px; color:#94a3b8; }
        .toast-msg { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#0f172a; color:#fff; padding:12px 20px; border-radius:12px; font-size:.85rem; font-weight:600; z-index:9999; }
    </style>
</head>
<body>
{% include 'trabajadores/_sidebar.html' %}
<div class="main">
    <h2><i class="bi bi-chat-square-text"></i> Peticiones, quejas y reclamos</h2>
    <p class="meta">Debes responder dentro de 15 días hábiles. Las de "Datos personales" tienen plazos propios (consultas 10 días hábiles, reclamos 15).</p>
    <div class="tabs" id="tabs">
        <button class="tab active" data-e="">Todas</button>
        <button class="tab" data-e="recibido">Recibidas</button>
        <button class="tab" data-e="en_tramite">En trámite</button>
        <button class="tab" data-e="resuelto">Resueltas</button>
    </div>
    <div id="lista"><div class="empty">Cargando...</div></div>
</div>
<script>
    let estado = '';
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function toast(t) { const d = document.createElement('div'); d.className = 'toast-msg'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

    // Cuenta días hábiles (lunes a viernes) transcurridos desde la fecha dd/mm/aaaa hh:mm. No descuenta festivos.
    function diasHabiles(f) {
        const m = /^(\d{2})\/(\d{2})\/(\d{4})/.exec(f || '');
        if (!m) return 0;
        const ini = new Date(+m[3], +m[2] - 1, +m[1]), hoy = new Date();
        let n = 0; const d = new Date(ini);
        while (d < hoy) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 0 && w !== 6) n++; }
        return n;
    }

    async function cargar() {
        const cont = document.getElementById('lista');
        try {
            const r = await fetch('/pqrs/admin/listar?estado=' + encodeURIComponent(estado), { credentials: 'include' });
            const d = await r.json();
            if (!r.ok) { cont.innerHTML = '<div class="empty">' + esc(d.error || 'Error') + '</div>'; return; }
            if (!d.pqrs.length) { cont.innerHTML = '<div class="empty">No hay solicitudes en esta vista.</div>'; return; }
            cont.innerHTML = d.pqrs.map(p => {
                const dh = diasHabiles(p.fecha);
                const venc = p.estado !== 'resuelto' && dh >= 12
                    ? `<span class="vencida"> · ${dh} días hábiles${dh >= 15 ? ' (plazo vencido)' : ' (por vencer)'}</span>` : '';
                return `<div class="card-p ${esc(p.estado)}" id="p${p.id_pqrs}">
                    <div><span class="rad">${esc(p.radicado)}</span> · ${esc(p.tipo)}${venc}</div>
                    <div class="meta">${esc(p.fecha)} · ${esc(p.nombre)} · ${esc(p.correo)}${p.telefono ? ' · ' + esc(p.telefono) : ''}${p.id_solicitud ? ' · Solicitud #' + esc(p.id_solicitud) : ''}</div>
                    <div class="msg">${esc(p.mensaje)}</div>
                    <textarea id="r${p.id_pqrs}" placeholder="Respuesta para el usuario (se envía por correo)">${esc(p.respuesta)}</textarea>
                    <div class="d-flex gap-2 mt-2 flex-wrap">
                        <button class="btn btn-sm btn-outline-primary" onclick="guardar(${p.id_pqrs},'en_tramite')">Marcar en trámite</button>
                        <button class="btn btn-sm btn-success" onclick="guardar(${p.id_pqrs},'resuelto')">Responder y resolver</button>
                    </div>
                </div>`;
            }).join('');
        } catch (e) { cont.innerHTML = '<div class="empty">Error de conexión</div>'; }
    }

    async function guardar(id, est) {
        const fd = new FormData();
        fd.append('id_pqrs', id); fd.append('estado', est);
        fd.append('respuesta', document.getElementById('r' + id).value);
        const r = await fetch('/pqrs/admin/responder', { method: 'POST', body: fd, credentials: 'include' });
        const d = await r.json().catch(() => ({}));
        if (r.ok) { toast('Guardado'); cargar(); } else toast(d.error || 'No se pudo guardar');
    }

    document.getElementById('tabs').addEventListener('click', (e) => {
        const b = e.target.closest('.tab'); if (!b) return;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        b.classList.add('active'); estado = b.dataset.e; cargar();
    });
    cargar();
</script>
</body>
</html>
